<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animedle</title>
  <style>
    :root {
      --bg: #121213;
      --panel: #1e1e20;
      --border: #3a3a3c;
      --active-border: #60a5fa;
      --text: #ffffff;
      --muted: #a1a1aa;
      --green: #538d4e;
      --yellow: #b59f3b;
      --gray: #3a3a3c;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
    .stats { display: flex; gap: 12px; font-size: 0.8rem; color: var(--muted); }
    .stats span strong { color: var(--text); }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--text); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.danger { border-color: var(--danger); color: #fca5a5; }

    #menu {
      max-width: 400px;
      width: 100%;
      background: var(--panel);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      margin-top: 30px;
      display: none;
    }
    
    .diff-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .diff-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      font-size: 1rem;
    }
    .diff-btn small { color: var(--muted); font-weight: 400; }

    #game {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      gap: 12px;
    }

    .top-bar { display: flex; justify-content: space-between; width: 100%; gap: 8px; }
    .anime-badge {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }
    .anime-badge span { color: #60a5fa; font-weight: 700; }

    .hints-box {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hints-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .hint-text {
      font-size: 0.9rem;
      background: #141416;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    #board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 6px 0;
    }
    .row { display: flex; gap: 6px; justify-content: center; }
    
    .tile {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 4px;
      user-select: none;
      transition: transform 0.1s, border-color 0.15s;
    }
    .tile.active-row { border-color: #52525b; }
    .tile.cursor {
      border-color: var(--active-border);
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.4);
    }
    .tile.correct { background: var(--green); border-color: var(--green); }
    .tile.present { background: var(--yellow); border-color: var(--yellow); }
    .tile.absent { background: var(--gray); border-color: var(--gray); }

    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    #keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .kb-row { display: flex; justify-content: center; gap: 4px; }
    .key {
      height: 44px;
      min-width: 30px;
      padding: 0;
      background: #52525b;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      flex: 1;
      max-width: 42px;
      color: white;
      cursor: pointer;
    }
    .key.wide { max-width: 65px; font-size: 0.75rem; }
    .key.correct { background: var(--green); }
    .key.present { background: var(--yellow); }
    .key.absent { background: #27272a; color: #71717a; }

    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 90;
    }

    #result {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 340px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
    }
    
    #char-img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 10px;
    }

    .anime-select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.95rem;
      cursor: pointer;
      appearance: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>ANIMEDLE</h1>
    <div class="stats">
      <span>Wins: <strong id="stat-total">0</strong></span>
      <span>Streak: <strong id="stat-streak">0</strong></span>
    </div>
  </header>

  <div id="loading" style="margin-top: 50px; color: var(--muted);">Loading...</div>

  <div id="menu">
    <h2>Select Difficulty</h2>
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 20px;">Guess the anime character in 5 tries.</p>
    
    <select id="anime-select" class="anime-select" style="margin-bottom: 16px;">
      <option value="all">All Anime</option>
    </select>

    <div class="diff-grid">
      <button class="diff-btn" onclick="startGame('easy')">
        <span>Easy</span>
        <small>5 letters or less</small>
      </button>
      <button class="diff-btn" onclick="startGame('medium')">
        <span>Medium</span>
        <small>6 letters</small>
      </button>
      <button class="diff-btn" onclick="startGame('hard')">
        <span>Hard</span>
        <small>7+ letters</small>
      </button>
    </div>
  </div>

  <div id="game">
    <div class="top-bar">
      <button onclick="showMenu()">Menu</button>
      <div class="anime-badge">Anime: <span id="anime-name"></span></div>
      <button class="danger" id="give-up-btn" onclick="giveUp()">Give Up</button>
    </div>

    <div class="hints-box" id="hints-box">
      <div class="hints-header">
        <span>Hints</span>
        <button id="next-hint-btn" onclick="revealHint()" style="padding: 4px 8px; font-size: 0.75rem;">Reveal Hint</button>
      </div>
      <div id="hints-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <div id="board"></div>

    <div id="keyboard"></div>
  </div>

  <div id="overlay"></div>

  <div id="result">
    <h3 id="result-title" style="margin: 0;"></h3>
    <img id="char-img" src="" alt="Loading..." />
    <p id="result-sub" style="margin: 0; color: var(--muted); font-size: 0.9rem;"></p>
    <button class="primary" onclick="nextRound()" style="margin-top: 8px; width: 100%;">Next Character</button>
  </div>

  <script>
    let data = [];
    let currentMode = "easy";
    let target = null;
    let wordLen = 5;
    let guesses = [];
    let currentTyped = "";
    let isGameOver = false;
    
    let hintIndexes = [];
    let hintsShown = 0;
    let keyStates = {};

    let savedStats = JSON.parse(localStorage.getItem("animedle_stats")) || {};
    let stats = {
      wins: parseInt(savedStats.wins, 10) || 0,
      streak: parseInt(savedStats.streak, 10) || 0
    };
    
    let lastAnime = localStorage.getItem("animedle_last_anime") || "";
    let usedNames = JSON.parse(localStorage.getItem("animedle_used")) || [];

    function updateStats() {
      document.getElementById("stat-total").textContent = stats.wins;
      document.getElementById("stat-streak").textContent = stats.streak;
      localStorage.setItem("animedle_stats", JSON.stringify(stats));
    }
    updateStats();

    window.onload = () => {
      document.getElementById("board").addEventListener("animationend", function() {
        this.classList.remove("shake");
      });

      fetch("data.json")
        .then(res => res.json())
        .then(json => {
          data = json;
          
          let animes = [...new Set(data.map(c => c.anime))].sort();
          let select = document.getElementById("anime-select");
          
          animes.forEach(a => {
            let opt = document.createElement("option");
            opt.value = a;
            opt.textContent = a;
            select.appendChild(opt);
          });

          document.getElementById("loading").style.display = "none";
          document.getElementById("menu").style.display = "block";
        })
        .catch(() => {
          document.getElementById("loading").textContent = "Failed to load data.";
        });
    };

    function startGame(mode) {
      currentMode = mode;
      document.getElementById("menu").style.display = "none";
      document.getElementById("game").style.display = "flex";
      nextRound();
    }

    function showMenu() {
      document.getElementById("game").style.display = "none";
      document.getElementById("menu").style.display = "block";
      document.getElementById("result").style.display = "none";
      document.getElementById("overlay").style.display = "none";
    }

    function nextRound() {
      let selectedAnime = document.getElementById("anime-select").value;
      
      let pool = data.filter(c => {
        if (selectedAnime !== "all" && c.anime !== selectedAnime) return false;
        
        let l = c.name.length;
        if (currentMode === "easy") return l <= 5;
        if (currentMode === "medium") return l === 6;
        return l >= 7;
      });

      if (pool.length === 0) {
        alert("No characters found for this combination. Try another difficulty or anime.");
        showMenu();
        return;
      }

      let fresh = pool.filter(c => !usedNames.includes(c.name));
      if (fresh.length === 0) {
        usedNames = [];
        fresh = pool;
      }

      let nonRepeat = fresh.filter(c => c.anime !== lastAnime);
      let finalPool = nonRepeat.length > 0 ? nonRepeat : fresh;
      
      target = finalPool[Math.floor(Math.random() * finalPool.length)];
      wordLen = target.name.length;
      
      guesses = [];
      currentTyped = "";
      isGameOver = false;
      hintsShown = 1;
      keyStates = {};
      
      lastAnime = target.anime;
      localStorage.setItem("animedle_last_anime", lastAnime);
      
      document.getElementById("anime-name").textContent = target.anime;
      document.getElementById("result").style.display = "none";
      document.getElementById("overlay").style.display = "none";
      document.getElementById("give-up-btn").disabled = false;
      document.getElementById("next-hint-btn").disabled = false;
      document.getElementById("hints-list").innerHTML = "";

      if (currentMode === "easy") {
        hintIndexes = [2, 1, 0];
      } else if (currentMode === "medium") {
        hintIndexes = [1, 0, 2];
      } else {
        hintIndexes = [0, 1, 2];
      }

      showHint();
      renderBoard();
      renderKeys();
    }

    function showHint() {
      if (hintsShown > 3) return;
      let box = document.getElementById("hints-list");
      let div = document.createElement("div");
      div.className = "hint-text";
      
      let hintData = target.hints[hintIndexes[hintsShown - 1]];
      div.textContent = `Hint ${hintsShown}: ${hintData}`;
      box.appendChild(div);
      
      if (hintsShown === 3) {
        document.getElementById("next-hint-btn").disabled = true;
      }
    }

    function revealHint() {
      if (hintsShown < 3 && !isGameOver) {
        hintsShown++;
        showHint();
      }
    }

    function renderBoard() {
      let board = document.getElementById("board");
      board.innerHTML = "";
      let size = wordLen >= 8 ? "38px" : "48px";
      
      for (let r = 0; r < 5; r++) {
        let row = document.createElement("div");
        row.className = "row";
        let isCurrentRow = r === guesses.length && !isGameOver;
        
        for (let c = 0; c < wordLen; c++) {
          let tile = document.createElement("div");
          tile.className = "tile";
          tile.style.width = size;
          tile.style.height = size;
          
          if (r < guesses.length) {
            tile.textContent = guesses[r].word[c];
            tile.classList.add(guesses[r].colors[c]);
          } else if (isCurrentRow) {
            tile.classList.add("active-row");
            tile.textContent = currentTyped[c] || "";
            if (c === currentTyped.length) {
              tile.classList.add("cursor");
            }
          }
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }

    const kbRows = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","⌫"]
    ];

    function renderKeys() {
      let kb = document.getElementById("keyboard");
      kb.innerHTML = "";
      
      kbRows.forEach(rowKeys => {
        let row = document.createElement("div");
        row.className = "kb-row";
        
        rowKeys.forEach(k => {
          let btn = document.createElement("button");
          btn.className = "key" + (k.length > 1 ? " wide" : "");
          btn.textContent = k;
          if (keyStates[k]) btn.classList.add(keyStates[k]);
          btn.onclick = () => handleInput(k);
          row.appendChild(btn);
        });
        kb.appendChild(row);
      });
    }

    document.addEventListener("keydown", e => {
      if (document.getElementById("game").style.display !== "flex" || e.ctrlKey || e.metaKey || e.altKey || isGameOver) return;
      let k = e.key.toUpperCase();
      
      if (k === "ENTER") handleInput("ENTER");
      else if (k === "BACKSPACE") handleInput("⌫");
      else if (/^[A-Z]$/.test(k)) handleInput(k);
    });

    function handleInput(k) {
      if (isGameOver) return;
      
      if (k === "⌫") {
        currentTyped = currentTyped.slice(0, -1);
      } else if (k === "ENTER") {
        if (currentTyped.length < wordLen) {
          let board = document.getElementById("board");
          board.classList.remove("shake");
          void board.offsetWidth; 
          board.classList.add("shake");
          return;
        }
        submitGuess();
        return;
      } else if (currentTyped.length < wordLen) {
        currentTyped += k;
      }
      renderBoard();
    }

    function submitGuess() {
      let colors = Array(wordLen).fill("absent");
      let targetArr = target.name.split("");
      let guessArr = currentTyped.split("");
      
      for (let i = 0; i < wordLen; i++) {
        if (guessArr[i] === targetArr[i]) {
          colors[i] = "correct";
          targetArr[i] = null;
          guessArr[i] = null;
        }
      }
      
      for (let i = 0; i < wordLen; i++) {
        if (guessArr[i] && targetArr.includes(guessArr[i])) {
          colors[i] = "present";
          targetArr[targetArr.indexOf(guessArr[i])] = null;
        }
      }

      guesses.push({ word: currentTyped, colors: colors });
      
      for (let i = 0; i < wordLen; i++) {
        let ch = currentTyped[i];
        let col = colors[i];
        if (col === "correct") keyStates[ch] = "correct";
        else if (col === "present" && keyStates[ch] !== "correct") keyStates[ch] = "present";
        else if (!keyStates[ch]) keyStates[ch] = "absent";
      }
      
      let won = currentTyped === target.name;
      currentTyped = "";
      renderBoard();
      renderKeys();
      
      if (won) {
        endGame(true);
      } else if (guesses.length >= 5) {
        endGame(false);
      }
    }

    function giveUp() {
      if (!isGameOver) endGame(false);
    }

    function endGame(won) {
      isGameOver = true;
      document.getElementById("give-up-btn").disabled = true;
      document.getElementById("next-hint-btn").disabled = true;
      
      usedNames.push(target.name);
      localStorage.setItem("animedle_used", JSON.stringify(usedNames));
      
      if (won) {
        stats.wins++;
        stats.streak++;
      } else {
        stats.streak = 0;
      }
      updateStats();
      
      let card = document.getElementById("result");
      let title = document.getElementById("result-title");
      let sub = document.getElementById("result-sub");
      let img = document.getElementById("char-img");
      
      title.textContent = won ? "Correct!" : "Game Over!";
      sub.textContent = `It was ${target.fullName}`;
      
      img.src = target.image || "";
      img.alt = target.image ? "Character Image" : "No Image Available";
      
      card.style.display = "flex";
      document.getElementById("overlay").style.display = "block";
    }
  </script>
</body>
</html>
